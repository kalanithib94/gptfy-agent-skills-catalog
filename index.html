<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPTfy Skills</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --ink: #202124;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #7c3aed;
      --accent-soft: #f3efff;
      --font: Inter, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { overflow: visible; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      padding: 1rem;
      overflow: visible;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 1rem;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 650;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .category { margin-bottom: 1.5rem; }
    .cat-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .category h2 {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .linkish {
      border: 0;
      background: none;
      color: var(--accent);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: 0.65rem;
    }
    .skill-card {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.75rem 0.8rem;
      min-width: 0;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      user-select: none;
    }
    .skill-card:hover {
      border-color: var(--accent);
      box-shadow: 0 3px 10px rgba(48, 32, 80, 0.08);
    }
    .skill-card.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .skill-check {
      margin-top: 0.2rem;
      width: 1rem;
      height: 1rem;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .card-body { min-width: 0; }
    .skill-card h3 {
      margin: 0 0 0.35rem;
      font-size: 0.9rem;
      font-weight: 650;
      color: var(--accent);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .skill-card p {
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bar {
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .bar .count {
      color: var(--muted);
      font-size: 0.9rem;
      min-width: 8rem;
    }
    .bar button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .bar button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .bar button.primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .bar .status {
      color: var(--muted);
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

    <h1>GPTfy Skills</h1>
    <p>41 skills — select one or more, then download a combined package</p>
  </header>
  <div class="wrap">
    <div class="bar">

  <script>
    const checks = () => [...document.querySelectorAll('.skill-check')];
    const countEl = document.getElementById('selCount');
    const btnDownload = document.getElementById('btnDownload');
    const statusEl = document.getElementById('status');

    function selectedNames() {
      return checks().filter(c => c.checked).map(c => c.value);
    }

    function syncUI() {
      const names = selectedNames();
      countEl.textContent = names.length + ' selected';
      btnDownload.disabled = names.length === 0;
      document.querySelectorAll('.skill-card').forEach(card => {
        const cb = card.querySelector('.skill-check');
        card.classList.toggle('selected', cb.checked);
      });
    }

    document.querySelectorAll('.skill-check').forEach(cb => {
      cb.addEventListener('change', syncUI);
    });

    document.getElementById('btnAll').addEventListener('click', () => {
      checks().forEach(c => { c.checked = true; });
      syncUI();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      checks().forEach(c => { c.checked = false; });
      syncUI();
      statusEl.textContent = '';
    });

    document.querySelectorAll('.select-cat').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        document.querySelectorAll('.category').forEach(sec => {
          if (sec.dataset.category !== cat) return;
          sec.querySelectorAll('.skill-check').forEach(c => { c.checked = true; });
        });
        syncUI();
      });
    });

    async function downloadCombined() {
      const names = selectedNames();
      if (!names.length) return;
      if (typeof JSZip === 'undefined') {
        statusEl.textContent = 'Zip library failed to load. Check network/CDN.';
        return;
      }

      btnDownload.disabled = true;
      statusEl.textContent = 'Building combined zip…';

      try {
        const out = new JSZip();
        const readmeLines = [
          'GPTfy combined skill package',
          '===========================',
          '',
          'Selected skills (' + names.length + '):',
          ...names.map(n => '  - ' + n),
          '',
          'Each folder is a ready-to-import skill package.',
          'Deploy Apex from any one package (handlers may overlap), then run each seed.apex',
          'after setting DATA_MAPPING and AI_MODEL.',
          ''
        ];
        out.file('SELECTED_SKILLS.txt', readmeLines.join('\n'));

        for (let i = 0; i < names.length; i++) {
          const name = names[i];
          statusEl.textContent = 'Fetching ' + (i + 1) + '/' + names.length + ': ' + name;
          const res = await fetch('zips/' + encodeURIComponent(name) + '.zip');
          if (!res.ok) throw new Error('Failed to fetch ' + name + ' (' + res.status + ')');
          const buf = await res.arrayBuffer();
          const skillZip = await JSZip.loadAsync(buf);
          const folder = out.folder(name);
          const tasks = [];
          skillZip.forEach((path, entry) => {
            if (entry.dir) return;
            // Individual zips are rooted as skillName/...
            const parts = path.split('/');
            const rel = parts[0] === name ? parts.slice(1).join('/') : path;
            if (!rel) return;
            tasks.push(
              entry.async('uint8array').then(data => folder.file(rel, data))
            );
          });
          await Promise.all(tasks);
        }

        statusEl.textContent = 'Compressing…';
        const blob = await out.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = 'gptfy-skills-selected-' + names.length + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.textContent = 'Downloaded ' + names.length + ' skills.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
      } finally {
        syncUI();
      }
    }

    btnDownload.addEventListener('click', downloadCombined);
    syncUI();

    // Report content height so the Dock embed can size itself.
    // Measure the content box, never the viewport: scrollHeight grows with the
    // iframe once it is taller than the content, which feeds back as a resize loop.
    let lastHeight = 0;
    let pending = false;

    function measure() {
      const styles = getComputedStyle(document.body);
      return Math.ceil(
        document.body.getBoundingClientRect().height +
        parseFloat(styles.marginTop) +
        parseFloat(styles.marginBottom)
      );
    }

    function reportHeight() {
      const height = measure();
      if (Math.abs(height - lastHeight) < 4) return;
      lastHeight = height;
      parent.postMessage({ type: 'gptfy-skills-height', height }, '*');
    }

    function scheduleReport() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        reportHeight();
      });
    }

    window.addEventListener('load', scheduleReport);
    window.addEventListener('resize', scheduleReport);
    if ('ResizeObserver' in window) {
      new ResizeObserver(scheduleReport).observe(document.body);
    }
    scheduleReport();
  </script>
</body>
</html>
